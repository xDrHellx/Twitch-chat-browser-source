<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Twitch Chat</title>
        <!-- Twitch chat library -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js"></script>
    </head>
    <body>
        <div id="chat"></div>
        <script type="module">
            // Init chat
            import TwitchChat from './TwitchChat.js';
            document.addEventListener('DOMContentLoaded', () => {
                new TwitchChat().initialize();
            });
        </script>
    </body>
</html>
